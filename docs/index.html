<title>Plan Gym Fede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface-2: #F0EDE6;
  --text: #17171A;
  --text-2: #4D4D57;
  --muted: #A1A1AA;
  --border: #E4E1D8;
  --border-strong: #C7C3B7;
  --accent-lun: #2563EB;
  --accent-mar: #059669;
  --accent-jue: #7C3AED;
  --accent-vie: #DC2626;
  --accent-core: #EA580C;
  --shadow: 0 1px 2px rgba(24,24,28,.04), 0 4px 14px rgba(24,24,28,.06);
  --shadow-lg: 0 2px 8px rgba(24,24,28,.05), 0 12px 32px rgba(24,24,28,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0C0E;
    --surface: #17171B;
    --surface-2: #1E1E23;
    --text: #F5F5F1;
    --text-2: #B5B5B8;
    --muted: #6E6E75;
    --border: #26262C;
    --border-strong: #3A3A42;
    --accent-lun: #60A5FA;
    --accent-mar: #34D399;
    --accent-jue: #A78BFA;
    --accent-vie: #F87171;
    --accent-core: #FB923C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #0C0C0E; --surface: #17171B; --surface-2: #1E1E23;
  --text: #F5F5F1; --text-2: #B5B5B8; --muted: #6E6E75;
  --border: #26262C; --border-strong: #3A3A42;
  --accent-lun: #60A5FA; --accent-mar: #34D399; --accent-jue: #A78BFA;
  --accent-vie: #F87171; --accent-core: #FB923C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lg: 0 2px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding: 0;
  min-height: 100%;
}
.container {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 18px;
  padding-block: 0 80px;
}

.hero { padding: 28px 0 8px; }
.hero .eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.hero h1 {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: clamp(40px, 9vw, 56px);
  letter-spacing: .01em; line-height: 1; margin: 0 0 4px;
  text-wrap: balance;
}
.hero .sub { color: var(--text-2); font-size: 14px; }

.tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
  margin: 14px -18px 18px;
  padding-inline: 18px;
}
.tabs-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab {
  appearance: none; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: 22px; letter-spacing: .04em;
  padding: 10px 4px 8px; border-radius: 12px;
  cursor: pointer; transition: all .18s ease;
}
.tab .day-short { display: block; font-size: 22px; line-height: 1; }
.tab .day-sess { display: block; font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; }
.tab[aria-selected="true"] {
  color: var(--accent); border-color: var(--accent);
  background: color-mix(in oklab, var(--accent) 8%, var(--surface));
}
.tab[aria-selected="true"] .day-sess { color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.day-header { margin: 4px 0 18px; }
.day-header .row1 {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.day-name {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: clamp(34px, 8vw, 44px);
  letter-spacing: .02em; line-height: 1; margin: 0;
  color: var(--accent);
}
.day-meta {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px; color: var(--text-2);
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}
.day-sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }
.day-patrones { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip {
  font-size: 11px; font-weight: 600; padding: 5px 10px;
  border-radius: 999px; background: var(--surface-2);
  color: var(--text-2); border: 1px solid var(--border);
}

.progress {
  margin: 14px 0 24px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; display: flex; align-items: center; gap: 12px;
}
.progress-bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; border-radius: 999px; }
.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums; min-width: 42px; text-align: right;
}

details {
  margin: 14px 0; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
}
details > summary {
  padding: 14px 16px; cursor: pointer;
  font-weight: 600; font-size: 13px; letter-spacing: .02em;
  display: flex; align-items: center; gap: 10px;
  list-style: none; color: var(--text-2); user-select: none;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::after {
  content: ""; width: 8px; height: 8px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg); margin-left: auto; transition: transform .2s ease;
}
details[open] > summary::after { transform: rotate(-135deg); }
details .content { padding: 0 16px 16px; color: var(--text-2); font-size: 13px; }
details .content ul { margin: 0; padding-left: 20px; }
details .content li { margin: 4px 0; }
details.warm > summary::before { content: ""; width: 8px; height: 8px; background: var(--accent-core); border-radius: 999px; }
details.rules > summary::before { content: ""; width: 8px; height: 8px; background: var(--accent-vie); border-radius: 999px; }

.blocks { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }

.card-p {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px 18px 16px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.card-p::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; background: var(--accent);
}
.card-p-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-p-n {
  font-family: 'Bebas Neue', 'Inter', sans-serif;
  font-size: 20px; width: 32px; height: 32px;
  background: var(--accent); color: white;
  display: grid; place-items: center; border-radius: 8px;
  flex-shrink: 0; letter-spacing: .02em;
}
.card-p-title {
  font-family: 'Inter', sans-serif; font-weight: 700;
  font-size: 16px; line-height: 1.25; letter-spacing: -0.005em;
  margin: 0; flex: 1;
}
.card-p-media {
  margin: 0 -6px 14px; aspect-ratio: 4 / 3;
  background: #F7F4EC; border-radius: 12px;
  position: relative; overflow: hidden;
  max-width: 100%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .card-p-media { background: #201F24; }
}
:root[data-theme="dark"] .card-p-media { background: #201F24; }
.card-p-media .frames {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}
.card-p-media img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain; padding: 8px;
  animation: flipFrames 1.4s steps(1) infinite;
}
.card-p-media img.f2 { animation-delay: 0.7s; }
@keyframes flipFrames {
  0%, 49.99% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.card-p-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 12px;
}
.stat {
  background: var(--surface-2); border-radius: 10px;
  padding: 8px 10px; text-align: center;
}
.stat .label {
  font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
  display: block; margin-bottom: 2px;
}
.stat .value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; font-weight: 700; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.card-p-notes {
  font-size: 13px; color: var(--text-2);
  padding-top: 12px; border-top: 1px solid var(--border); line-height: 1.45;
}
.series { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
.series-label {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
}
.series-boxes { display: flex; gap: 8px; }
.check {
  width: 28px; height: 28px; border: 2px solid var(--border-strong);
  border-radius: 8px; cursor: pointer; display: grid; place-items: center;
  background: transparent; transition: all .15s ease; padding: 0;
  color: transparent; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
}
.check:hover { border-color: var(--accent); }
.check[aria-checked="true"] {
  background: var(--accent); border-color: var(--accent); color: white;
}
.check[aria-checked="true"]::after { content: "✓"; }
.check:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.card-c {
  background: color-mix(in oklab, var(--accent-core) 6%, var(--surface));
  border: 1px solid color-mix(in oklab, var(--accent-core) 30%, var(--border));
  border-radius: 14px; padding: 12px 14px;
  display: grid; grid-template-columns: 72px 1fr;
  gap: 14px; align-items: center;
  position: relative; margin-left: 24px;
}
.card-c::before {
  content: ""; position: absolute; left: -24px; top: 50%;
  width: 20px; height: 2px; background: var(--accent-core);
  transform: translateY(-50%);
}
.card-c-media {
  width: 72px; height: 72px;
  background: color-mix(in oklab, var(--accent-core) 8%, var(--surface));
  border-radius: 10px; position: relative; overflow: hidden;
  border: 1px solid color-mix(in oklab, var(--accent-core) 20%, var(--border));
}
.card-c-media img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; padding: 4px;
  animation: flipFrames 1.4s steps(1) infinite;
}
.card-c-media img.f2 { animation-delay: 0.7s; }
.card-c-body { min-width: 0; }
.card-c-eyebrow {
  font-size: 9px; font-weight: 800; letter-spacing: .18em;
  text-transform: uppercase; color: var(--accent-core); margin-bottom: 2px;
}
.card-c-title {
  font-family: 'Inter', sans-serif; font-weight: 700;
  font-size: 15px; color: var(--text); margin: 0 0 2px; line-height: 1.2;
}
.card-c-meta {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text-2); font-variant-numeric: tabular-nums;
}
.card-c-note { font-size: 12px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }

.reset {
  appearance: none; background: none; border: 1px solid var(--border);
  color: var(--text-2); border-radius: 999px; padding: 6px 12px;
  font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
}
.reset:hover { border-color: var(--accent); color: var(--accent); }

.footer {
  text-align: center; color: var(--muted); font-size: 12px;
  padding: 40px 0 20px;
}
.footer strong { color: var(--text-2); }
.credit { font-size: 10px; margin-top: 8px; color: var(--muted); }

@media (max-width: 420px) {
  .card-c { margin-left: 16px; padding: 10px 12px; grid-template-columns: 64px 1fr; gap: 12px; }
  .card-c::before { left: -16px; width: 14px; }
  .card-c-media { width: 64px; height: 64px; }
  .card-p-stats { grid-template-columns: 1fr 1fr; }
  .card-p-stats .stat:nth-child(3) { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .card-p-media img, .card-c-media img { animation: none !important; opacity: 1 !important; }
  .card-p-media img.f2, .card-c-media img.f2 { display: none; }
}
</style>

</div>

const DAYS = ['LUN', 'MAR', 'JUE', 'VIE'];
function daykey() { return new Date().toISOString().slice(0, 10); }
function stateKey(day) { return `fede-gym::${day}::${daykey()}`; }
function loadState(day) {
  try { const raw = localStorage.getItem(stateKey(day)); return raw ? JSON.parse(raw) : {}; }
  catch { return {}; }
}
function saveState(day, s) {
  try { localStorage.setItem(stateKey(day), JSON.stringify(s)); } catch {}
}
function pickDefaultDay() {
  const dow = new Date().getDay();
  if (dow === 1) return 'LUN';
  if (dow === 2) return 'MAR';
  if (dow === 4) return 'JUE';
  if (dow === 5) return 'VIE';
  return 'LUN';
}

function makeFrames(imgKey) {
  const frames = IMGS[imgKey];
  if (!frames) return '';
  return `<img src="${frames[0]}" alt="" class="f1">
          <img src="${frames[1]}" alt="" class="f2">`;
}

function render(day) {
  const plan = PLAN[day];
  const state = loadState(day);
  const container = document.getElementById('dayContent');
  document.documentElement.style.setProperty('--accent', plan.accent);
  document.querySelectorAll('.tab').forEach(t => {
    const sel = t.dataset.day === day;
    t.setAttribute('aria-selected', sel);
    t.style.setProperty('--accent', PLAN[t.dataset.day].accent);
  });

  const totalSeries = plan.bloques.filter(b => b.tipo === 'p').reduce((s, b) => s + b.series, 0);
  const doneSeries = Object.values(state).filter(Boolean).length;
  const pct = totalSeries === 0 ? 0 : Math.round(doneSeries / totalSeries * 100);

  let html = '';
  html += `<div class="day-header">
    <div class="row1">
      <h2 class="day-name">${plan.dia}</h2>
      <div class="day-meta">${plan.hora} · ${plan.duracion}</div>
    </div>
    <div class="day-sub">${plan.sesion}</div>
    <div class="day-patrones">${plan.patrones.map(p => `<span class="chip">${p}</span>`).join('')}</div>
  </div>`;

  html += `<div class="progress">
    <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${doneSeries}/${totalSeries}</div>
    <button class="reset" onclick="resetDay('${day}')">Reset</button>
  </div>`;

  html += `<details class="warm">
    <summary>Calentamiento (8 min)</summary>
    <div class="content"><ul>${plan.calentamiento.map(i => `<li>${i}</li>`).join('')}</ul></div>
  </details>`;

  html += `<div class="blocks">`;
  let cCount = 0;
  plan.bloques.forEach((b, idx) => {
    if (b.tipo === 'p') {
      const boxes = Array.from({length: b.series}, (_, i) => {
        const k = `${idx}-${i}`;
        const checked = !!state[k];
        return `<button class="check" role="checkbox" aria-checked="${checked}" data-key="${k}" data-day="${day}" aria-label="Serie ${i+1}"></button>`;
      }).join('');
      html += `<article class="card-p">
        <header class="card-p-head">
          <div class="card-p-n">${b.n}</div>
          <h3 class="card-p-title">${b.nombre}</h3>
        </header>
        <div class="card-p-media" aria-hidden="true">${makeFrames(b.img)}</div>
        <div class="card-p-stats">
          <div class="stat"><span class="label">Series × Reps</span><span class="value">${b.sr}</span></div>
          <div class="stat"><span class="label">RIR</span><span class="value">${b.rir}</span></div>
          <div class="stat"><span class="label">Descanso</span><span class="value">${b.desc}</span></div>
        </div>
        <div class="series">
          <span class="series-label">Series</span>
          <div class="series-boxes">${boxes}</div>
        </div>
        <p class="card-p-notes">${b.notas}</p>
      </article>`;
    } else {
      cCount++;
      html += `<div class="card-c">
        <div class="card-c-media" aria-hidden="true">${makeFrames(b.img)}</div>
        <div class="card-c-body">
          <div class="card-c-eyebrow">Core después de #${plan.bloques.filter((x,i) => x.tipo==='p' && i<idx).length}</div>
          <h4 class="card-c-title">${b.nombre}</h4>
          <div class="card-c-meta">${b.reps}</div>
          <div class="card-c-note">${b.nota}</div>
        </div>
      </div>`;
    }
  });
  html += `</div>`;

  html += `<details class="rules">
    <summary>Reglas de oro</summary>
    <div class="content"><ul>
      <li><strong>FC ≤ 121 lpm</strong> todo el tiempo (restricción vigente hasta ECG)</li>
      <li><strong>Exhalar en el esfuerzo</strong> — nunca Valsalva prolongada</li>
      <li><strong>RIR nunca 0</strong> — sin fallo absoluto en este bloque</li>
      <li>Calentamiento 8 min <em>siempre</em>, aunque tengas apuro</li>
      <li>Técnica antes que carga: si se rompe la forma, bajás peso</li>
      <li>Si dormiste &lt;6h → sacás 1 serie de cada principal</li>
      <li>Dolor articular (no muscular) &gt;72h → parás ese ejercicio</li>
    </ul></div>
  </details>`;

  container.innerHTML = html;

  container.querySelectorAll('.check').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.key;
      const d = el.dataset.day;
      const s = loadState(d);
      s[key] = !s[key];
      saveState(d, s);
      el.setAttribute('aria-checked', s[key] ? 'true' : 'false');
      updateProgress(d);
    });
  });
}

function updateProgress(day) {
  const plan = PLAN[day];
  const state = loadState(day);
  const totalSeries = plan.bloques.filter(b => b.tipo === 'p').reduce((s, b) => s + b.series, 0);
  const doneSeries = Object.values(state).filter(Boolean).length;
  const pct = totalSeries === 0 ? 0 : Math.round(doneSeries / totalSeries * 100);
  const fill = document.querySelector('.progress-bar-fill');
  const lbl = document.querySelector('.progress-label');
  if (fill) fill.style.width = pct + '%';
  if (lbl) lbl.textContent = `${doneSeries}/${totalSeries}`;
}

function resetDay(day) {
  try { localStorage.removeItem(stateKey(day)); } catch {}
  render(day);
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => render(t.dataset.day)));
render(pickDefaultDay());
</script>
