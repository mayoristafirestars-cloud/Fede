<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Médico — Gestión</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
  header { background: #0d9488; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 20px; }
  .card h2 { margin-top: 0; font-size: 16px; color: #0f766e; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  button { background: #0d9488; color: white; border: 0; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button:hover { background: #0f766e; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
  th { background: #f1f5f9; font-weight: 600; color: #334155; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-medico { background: #dbeafe; color: #1e40af; }
  .badge-nutricionista { background: #dcfce7; color: #166534; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: #f8fafc; border-radius: 8px; padding: 14px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: 700; color: #0f766e; }
  .stat .lbl { font-size: 12px; color: #64748b; }
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <span style="font-size:22px">🩺</span>
  <h1>Médico — Gestión de Profesionales</h1>
</header>

<main>

  <div class="card">
    <h2>Estado</h2>
    <div id="stats" class="stats"></div>
  </div>

  <div class="card">
    <h2>Nuevo profesional</h2>
    <form id="form-prof">
      <div>
        <label>Tipo *</label>
        <select name="tipo" required>
          <option value="medico">Médico</option>
          <option value="nutricionista">Nutricionista</option>
        </select>
      </div>
      <div><label>Nombre *</label><input name="nombre" required></div>
      <div><label>Apellido *</label><input name="apellido" required></div>
      <div><label>Matrícula *</label><input name="matricula" required></div>
      <div><label>DNI</label><input name="dni"></div>
      <div><label>Especialidad</label><input name="especialidad" placeholder="Clínica, Pediatría, Deportiva..."></div>
      <div><label>Teléfono</label><input name="telefono"></div>
      <div><label>Email</label><input name="email" type="email"></div>
      <div class="full"><label>Dirección</label><input name="direccion"></div>
      <div class="full"><button type="submit">Guardar profesional</button></div>
    </form>
  </div>

  <div class="card">
    <h2>Profesionales registrados</h2>
    <div class="toolbar">
      <select id="filtro-tipo">
        <option value="">Todos</option>
        <option value="medico">Médicos</option>
        <option value="nutricionista">Nutricionistas</option>
      </select>
      <input id="filtro-buscar" placeholder="Buscar por nombre, apellido o matrícula">
      <button onclick="cargar()">Buscar</button>
    </div>
    <table>
      <thead>
        <tr><th>Tipo</th><th>Apellido, Nombre</th><th>Matrícula</th><th>Especialidad</th><th>Teléfono</th><th>Email</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</main>

<script>
async function estado() {
  const r = await fetch('/api/estado'); const d = await r.json();
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${d.registros.medicos}</div><div class="lbl">Médicos</div></div>
    <div class="stat"><div class="num">${d.registros.nutricionistas}</div><div class="lbl">Nutricionistas</div></div>
    <div class="stat"><div class="num">${d.registros.pacientes}</div><div class="lbl">Pacientes</div></div>
    <div class="stat"><div class="num">${d.registros.consultas}</div><div class="lbl">Consultas</div></div>`;
}

async function cargar() {
  const tipo = document.getElementById('filtro-tipo').value;
  const buscar = document.getElementById('filtro-buscar').value;
  const qs = new URLSearchParams();
  if (tipo) qs.set('tipo', tipo);
  if (buscar) qs.set('buscar', buscar);
  const r = await fetch('/api/profesionales?' + qs.toString());
  const lista = await r.json();
  document.getElementById('tbody').innerHTML = lista.map(p => `
    <tr>
      <td><span class="badge badge-${p.tipo}">${p.tipo}</span></td>
      <td>${p.apellido}, ${p.nombre}</td>
      <td>${p.matricula}</td>
      <td>${p.especialidad || ''}</td>
      <td>${p.telefono || ''}</td>
      <td>${p.email || ''}</td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:#94a3b8">Sin registros</td></tr>';
}

document.getElementById('form-prof').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const r = await fetch('/api/profesionales', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  });
  if (r.ok) { e.target.reset(); estado(); cargar(); }
  else alert('Error: ' + (await r.text()));
});

estado(); cargar();
</script>

</body>
</html>
