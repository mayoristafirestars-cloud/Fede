services:
  - type: web
    name: chatbot-multicanal
    runtime: python
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # El resto de las variables se cargan a mano en el panel
      # de Render (Settings > Environment), copiando de .env.example.
