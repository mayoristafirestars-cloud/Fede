</style>
<text class="h1" x="0" y="-120">PLANILLA DE RELEVAMIENTO — SECTOR COCINA / LAVADERO / PATIO</text>
<text class="td" x="0" y="-80">A. Guevara 871, Santa Rosa · completar en obra con cinta métrica · esquema SIN ESCALA</text>
<g transform="translate(60,60)"><rect class="wex" x="0" y="0" width="240" height="300"/><text class="lc" x="120" y="150" text-anchor="middle">CASA</text><text class="lb" x="120" y="178" text-anchor="middle">EXISTENTE</text><rect class="wex" x="240" y="0" width="220" height="300"/><rect class="loc" x="252" y="12" width="196" height="276"/><text class="lc" x="350" y="120" text-anchor="middle">COCINA ACTUAL</text><text class="lb" x="350" y="148" text-anchor="middle">→ LAVADERO</text><rect class="whu" x="460" y="40" width="300" height="260"/><rect class="loc2" x="472" y="52" width="276" height="236"/><text class="lc" x="610" y="150" text-anchor="middle">HUECO</text><text class="lb" x="610" y="178" text-anchor="middle">→ COCINA NUEVA</text><text class="lb" x="610" y="206" text-anchor="middle">(muros y contrapiso ya hechos)</text><text class="lc" x="900" y="150" text-anchor="middle">PATIO</text><text class="lb" x="900" y="178" text-anchor="middle">asador existente</text><rect class="hue" x="330" y="288" width="90" height="12"/><line class="ab" x1="330" y1="300" x2="420" y2="300"/><text class="lb" x="375" y="336" text-anchor="middle">puerta actual</text><rect class="hue" x="700" y="288" width="60" height="12"/><line class="ab" x1="700" y1="300" x2="760" y2="300"/><text class="lb" x="730" y="336" text-anchor="middle">vano c/dintel</text><line class="cot" x1="252" y1="-70" x2="448" y2="-70"/><line class="cot" x1="252" y1="-78" x2="252" y2="-62"/><line class="cot" x1="448" y1="-78" x2="448" y2="-62"/><circle class="bal" cx="350.0" cy="-86" r="15"/><text class="bl" x="350.0" y="-80" text-anchor="middle">A</text><line class="cot" x1="472" y1="-70" x2="748" y2="-70"/><line class="cot" x1="472" y1="-78" x2="472" y2="-62"/><line class="cot" x1="748" y1="-78" x2="748" y2="-62"/><circle class="bal" cx="610.0" cy="-86" r="15"/><text class="bl" x="610.0" y="-80" text-anchor="middle">C</text><line class="cot" x1="252" y1="12" x2="252" y2="288"/><line class="cot" x1="244" y1="12" x2="26