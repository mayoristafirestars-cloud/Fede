<text class="h2" x="0" y="600">MEDIDAS A TOMAR</text>
<g transform="translate(0,630)"><line class="tl" x1="0" y1="0" x2="1180" y2="0"/><circle class="bal" cx="30" cy="29" r="15"/><text class="bl" x="30" y="35" text-anchor="middle">A</text><text class="td" x="70" y="35" text-anchor="start">Ancho de la cocina actual (interior)</text><line class="tl" x1="900" y1="0" x2="900" y2="46"/><text class="tdd" x="1035" y="35" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="46" x2="1180" y2="46"/><circle class="bal" cx="30" cy="75" r="15"/><text class="bl" x="30" y="81" text-anchor="middle">B</text><text class="td" x="70" y="81" text-anchor="start">Largo de la cocina actual (interior)</text><line class="tl" x1="900" y1="46" x2="900" y2="92"/><text class="tdd" x="1035" y="81" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="92" x2="1180" y2="92"/><circle class="bal" cx="30" cy="121" r="15"/><text class="bl" x="30" y="127" text-anchor="middle">C</text><text class="td" x="70" y="127" text-anchor="start">Ancho del hueco (interior, entre caras de muro)</text><line class="tl" x1="900" y1="92" x2="900" y2="138"/><text class="tdd" x="1035" y="127" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="138" x2="1180" y2="138"/><circle class="bal" cx="30" cy="167" r="15"/><text class="bl" x="30" y="173" text-anchor="middle">D</text><text class="td" x="70" y="173" text-anchor="start">Largo del hueco (interior)</text><line class="tl" x1="900" y1="138" x2="900" y2="184"/><text class="tdd" x="1035" y="173" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="184" x2="1180" y2="184"/><circle class="bal" cx="30" cy="213" r="15"/><text class="bl" x="30" y="219" text-anchor="middle">E</text><text class="td" x="70" y="219" text-anchor="start">Altura libre del muro del hueco, del contrapiso al coronamiento</text><line class="tl" x1="900" y1="184" x2="900" y2="230"/><text class="tdd" x="1035" y="219" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="230" x2="1180" y2="230"/><circle class="bal" cx="30" cy="259" r="15"/><text class="bl" x="30" y="265" text-anchor="middle">F</text><text class="td" x="70" y="265" text-anchor="start">Ancho del vano existente con dintel</text><line class="tl" x1="900" y1="230" x2="900" y2="276"/><text class="tdd" x="1035" y="265" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="276" x2="1180" y2="276"/><circle class="bal" cx="30" cy="305" r="15"/><text class="bl" x="30" y="311" text-anchor="middle">G</text><text class="td" x="70" y="311" text-anchor="start">Altura de ese vano, del contrapiso al dintel</text><line class="tl" x1="900" y1="276" x2="900" y2="322"/><text class="tdd" x="1035" y="311" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="322" x2="1180" y2="322"/><circle class="bal" cx="30" cy="351" r="15"/><text class="bl" x="30" y="357" text-anchor="middle">H</text><text class="td" x="70" y="357" text-anchor="start">Espesor de los muros del hueco</text><line class="tl" x1="900" y1="322" x2="900" y2="368"/><text class="tdd" x="1035" y="357" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="368" x2="1180" y2="368"/><circle class="bal" cx="30" cy="397" r="15"/><text class="bl" x="30" y="403" text-anchor="middle">I</text><text class="td" x="70" y="403" text-anchor="start">Ancho de la puerta actual cocina → patio</text><line class="tl" x1="900" y1="368" x2="900" y2="414"/><text class="tdd" x="1035" y="403" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="414" x2="1180" y2="414"/><circle class="bal" cx="30" cy="443" r="15"/><text class="bl" x="30" y="449" text-anchor="middle">J</text><text class="td" x="70" y="449" text-anchor="start">Altura libre de la cocina actual (piso a cielorraso)</text><line class="tl" x1="900" y1="414" x2="900" y2="460"/><text class="tdd" x="1035" y="449" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="460" x2="1180" y2="460"/><circle class="bal" cx="30" cy="489" r="15"/><text class="bl" x="30" y="495" text-anchor="middle">K</text><text class="td" x="70" y="495" text-anchor="start">Distancia del hueco a la medianera más cercana</text><line class="tl" x1="900" y1="460" x2="900" y2="506"/><text class="tdd" x="1035" y="495" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="506" x2="1180" y2="506"/><circle class="bal" cx="30" cy="535" r="15"/><text class="bl" x="30" y="541" text-anchor="middle">L</text><text class="td" x="70" y="541" text-anchor="start">Distancia del hueco al asador</text><line class="tl" x1="900" y1="506" x2="900" y2="552"/><text class="tdd" x="1035" y="541" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="552" x2="1180" y2="552"/><circle class="bal" cx="30" cy="581" r="15"/><text class="bl" x="30" y="587" text-anchor="middle">M</text><text class="td" x="70" y="587" text-anchor="start">Desnivel entre piso de cocina y contrapiso del patio</text><line class="tl" x1="900" y1="552" x2="900" y2="598"/><text class="tdd" x="1035" y="587" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="598" x2="1180" y2="598"/><circle class="bal" cx="30" cy="627" r="15"/><text class="bl" x="30" y="633" text-anchor="middle">N</text><text class="td" x="70" y="633" text-anchor="start">Distancia de la pileta actual al muro del hueco</text><line class="tl" x1="900" y1="598" x2="900" y2="644"/><text class="tdd" x="1035" y="633" text-anchor="middle">. . . . . . . . . . . .  m</text><line class="tl" x1="0" y1="644" x2="1180" y2="644"/></g>
<g transform="translate(1330,-40)">
 <text class="h2" x="0" y="0">VERIFICACIONES</text>
 <g transform="translate(0,30)"><rect class="box" x="0" y="0" width="26" height="26"/><text class="td" x="42" y="21" text-anchor="start">Estado del coronamiento de los muros del hueco: ¿tiene capa aisladora o albardilla?</text><rect class="box" x="0" y="44" width="26" height="26"/><text class="td" x="42" y="65" text-anchor="start">¿Hay encadenado superior en los muros del hueco?</text><rect class="box" x="0" y="88" width="26" height="26"/><text class="td" x="42" y="109" text-anchor="start">¿El contrapiso del hueco está sano o hay que romperlo para pasar instalaciones?</text><rect class="box" x="0" y="132" width="26" height="26"/><text class="td" x="42" y="153" text-anchor="start">¿Dónde descarga hoy la bajada pluvial de la casa? ¿A qué distancia del muro?</text><rect class="box" x="0" y="176" width="26" height="26"/><text class="td" x="42" y="197" text-anchor="start">¿Hay capa aisladora horizontal en la base de los muros? (cateo)</text><rect class="box" x="0" y="220" width="26" height="26"/><text class="td" x="42" y="241" text-anchor="start">Ubicación del desagüe cloacal y de la cámara de inspección más cercana</text><rect class="box" x="0" y="264" width="26" height="26"/><text class="td" x="42" y="285" text-anchor="start">Ubicación del medidor de gas y recorrido actual de la cañería</text><rect class="box" x="0" y="308" width="26" height="26"/><text class="td" x="42" y="329" text-anchor="start">Tablero eléctrico: ubicación y si tiene disyuntor y jabalina</text><rect class="box" x="0" y="352" width="26" height="26"/><text class="td" x="42" y="373" text-anchor="start">Estructura del tanque elevado: estado del hormigón y de la columna</text><rect class="box" x="0" y="396" width="26" height="26"/><text class="td" x="42" y="417" text-anchor="start">Foto del muro de la cocina desde adentro, a la altura del zócalo</text></g>
</g>
<g transform="translate(1330,470)">
 <text class="h2" x="0" y="0">LO QUE SE VE EN LAS FOTOS</text>
 <text class="adv" x="0" y="42">⚠ HUMEDAD ACTIVA — resolver antes de terminar nada</text>
 <text class="td" x="0" y="80">· Manchas oscuras que bajan desde el coronamiento: los muros están</text>
 <text class="td" x="0" y="108">  descabezados, sin albardilla ni capa aisladora. Entra agua por arriba.</text>
 <text class="td" x="0" y="136">· Revoque desprendido en la base de la fachada del patio: compatible</text>
 <text class="td" x="0" y="164">  con humedad ascendente por capilaridad. Confirmar con cateo.</text>
 <text class="td" x="0" y="192">· La bajada pluvial descarga al pie del muro. Sobre loess colapsable</text>
 <text class="td" x="0" y="220">  eso es un riesgo de fundación, no un problema estético.</text>
 <text class="h2" x="0" y="270">A FAVOR</text>
 <text class="td" x="0" y="308">· El hueco ya tiene muros perimetrales y contrapiso ejecutados.</text>
 <text class="td" x="0" y="336">· Hay un vano con dintel resuelto: puede ser la puerta al patio.</text>
 <text class="td" x="0" y="364">· Hay viga de hormigón colocada: el recinto estaba previsto para losa.</text>
 <text class="td" x="0" y="392">· Asador existente en el patio: define la galería y el uso de verano.</text>
</g>
