 <text class="rt3" x="240" y="168">FECHA</text><text class="td" x="240" y="200">09/2026</text>
 <text class="rt3" x="500" y="168">RELEVÓ</text><text class="tdd" x="500" y="200">. . . . . . . . . . . . . . . . . . .</text>
