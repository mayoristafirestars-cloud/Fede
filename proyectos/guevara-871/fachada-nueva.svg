<line class="d" x1="-58" y1="0" x2="-58" y2="320"/><line class="d" x1="-67" y1="0" x2="-49" y2="0"/><line class="d" x1="-67" y1="320" x2="-49" y2="320"/><text class="c" x="-72" y="160.0" text-anchor="middle" transform="rotate(-90,-72,160.0)">3,20</text>
