    <stop offset="0" stop-color="#dbe7f0"/><stop offset="1" stop-color="#f2f0ea"/>
  </linearGradient>
  <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9db9cc"/><stop offset="0.45" stop-color="#c3d6e2"/>
    <stop offset="0.46" stop-color="#8fadc2"/><stop offset="1" stop-color="#b3cad8"/>
