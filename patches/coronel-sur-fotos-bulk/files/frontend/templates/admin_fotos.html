<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Importar Fotos</title>
<link rel="icon" href="/static/logo-coronel.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F3F4F6;color:#1F2937;min-height:100vh}
.topbar{background:#F08340;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:18px;font-weight:700;flex:1}
.topbar a{color:#fff;font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;background:rgba(255,255,255,.2);text-decoration:none}
.topbar a:hover{background:rgba(255,255,255,.3)}
.container{max-width:720px;margin:40px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
h2{font-size:22px;font-weight:800;margin-bottom:8px}
.subtitle{color:#6B7280;font-size:14px;margin-bottom:24px;line-height:1.5}
.drop-zone{border:2px dashed #D1D5DB;border-radius:10px;padding:48px 24px;text-align:center;cursor:pointer;transition:.15s;background:#F9FAFB}
.drop-zone:hover,.drop-zone.drag{border-color:#F08340;background:#FFF5EE}
.drop-zone .ico{font-size:48px;margin-bottom:12px}
.drop-zone .t1{font-size:15px;font-weight:600;color:#374151}
.drop-zone .t2{font-size:12px;color:#9CA3AF;margin-top:4px}
.drop-zone input[type=file]{display:none}
.file-info{margin-top:16px;padding:12px 16px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;font-size:13px;display:none}
.file-info.show{display:block}
.file-info b{color:#1D4ED8}
.btn-primary{margin-top:20px;padding:14px 32px;background:#F08340;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;width:100%}
.btn-primary:hover{background:#DA6F30}
.btn-primary:disabled{background:#D1D5DB;color:#9CA3AF;cursor:not-allowed}
.progress-bar{height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden;margin-top:16px;display:none}
.progress-bar.show{display:block}
.progress-bar .fill{height:100%;background:#F08340;width:0;transition:width .3s}
.result{margin-top:20px;padding:20px;border-radius:10px;font-size:14px;display:none}
.result.show{display:block}
.result.ok{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}
.result.err{background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
.result h3{font-size:16px;font-weight:700;margin-bottom:10px}
.result .stat{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid rgba(0,0,0,.08);font-size:13px}
.result .stat:first-child{border-top:none}
.result .stat b{font-variant-numeric:tabular-nums}
.result details{margin-top:12px;font-size:12px}
.result details summary{cursor:pointer;color:#065F46;font-weight:600}
.result details code{display:block;margin-top:8px;padding:8px;background:rgba(0,0,0,.05);border-radius:4px;font-family:monospace;white-space:pre-wrap;word-break:break-all}
.login-box{max-width:360px;margin:80px auto;background:#fff;border-radius:12px;padding:32px;box-shadow:0 8px 24px rgba(0,0,0,.1);text-align:center}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:8px}
.login-box p{font-size:13px;color:#6B7280;margin-bottom:20px}
.login-box input{width:100%;padding:12px;border:1px solid #D1D5DB;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:#F08340}
.login-box button{width:100%;padding:12px;background:#F08340;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box .err{color:#EF4444;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>

<div id="app-login" style="display:none">
  <div class="login-box">
    <h2>Admin Fotos</h2>
    <p>Ingresá con tu usuario administrador</p>
    <input type="text" id="lg-user" placeholder="Usuario">
    <input type="password" id="lg-pass" placeholder="Contraseña">
    <button onclick="doLogin()">Ingresar</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div id="app-main" style="display:none">
  <div class="topbar">
    <a href="/">← CRM</a>
    <h1>Importar fotos desde CSV</h1>
  </div>
  <div class="container">
    <div class="card">
      <h2>📸 Actualizar fotos en bulk</h2>
      <p class="subtitle">Subí el Excel/CSV exportado desde FactuPyme (o cualquier CSV con columnas <b>Codigo</b> e <b>imagenes</b>). El sistema actualiza el campo <code>foto_url</code> de cada producto matcheando por código.</p>

      <label class="drop-zone" id="drop">
        <input type="file" id="file" accept=".csv,.txt" onchange="onFile()">
        <div class="ico">📂</div>
        <div class="t1">Click para elegir archivo o arrastralo acá</div>
        <div class="t2">CSV con separador ; o ,   •   Encoding UTF-8, Latin-1 o Windows</div>
      </label>

      <div class="file-info" id="fi"><b id="fi-name"></b> — <span id="fi-size"></span></div>

      <button class="btn-primary" id="btn-go" onclick="importar()" disabled>Importar fotos</button>

      <div class="progress-bar" id="pb"><div class="fill" id="pb-fill"></div></div>

      <div class="result" id="result"></div>
    </div>
  </div>
</div>

<script>
var TOKEN='',FILE=null;

function getToken(){
  var keys=['cs_token','token','admin_token','crm_token'];
  for(var i=0;i<keys.length;i++){var t=localStorage.getItem(keys[i]);if(t)return t}
  return '';
}

async function doLogin(){
  var u=document.getElementById('lg-user').value.trim();
  var p=document.getElementById('lg-pass').value;
  var e=document.getElementById('lg-err');e.style.display='none';
  if(!u||!p){e.textContent='Completá usuario y contraseña';e.style.display='block';return}
  try{
    var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var d=await r.json();
    if(!r.ok){e.textContent=d.detail||'Error';e.style.display='block';return}
    TOKEN=d.token||d.access_token||'';
    if(!TOKEN){e.textContent='No se recibió token';e.style.display='block';return}
    localStorage.setItem('cs_token',TOKEN);
    showApp();
  }catch(err){e.textContent='Error de conexión';e.style.display='block'}
}

function showApp(){
  document.getElementById('app-login').style.display='none';
  document.getElementById('app-main').style.display='block';
}

function onFile(){
  var f=document.getElementById('file').files[0];
  if(!f)return;
  FILE=f;
  document.getElementById('fi-name').textContent=f.name;
  document.getElementById('fi-size').textContent=(f.size/1024).toFixed(1)+' KB';
  document.getElementById('fi').classList.add('show');
  document.getElementById('btn-go').disabled=false;
}

// Drag & drop
var dz=document.getElementById('drop');
if(dz){
  dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag')});
  dz.addEventListener('dragleave',function(){dz.classList.remove('drag')});
  dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('drag');var f=e.dataTransfer.files[0];if(f){document.getElementById('file').files=e.dataTransfer.files;onFile()}});
}

async function importar(){
  if(!FILE)return;
  var btn=document.getElementById('btn-go');
  var pb=document.getElementById('pb');
  var fill=document.getElementById('pb-fill');
  var res=document.getElementById('result');
  btn.disabled=true;btn.textContent='Procesando... (puede tardar 30-60 segundos)';
  pb.classList.add('show');fill.style.width='20%';
  res.classList.remove('show');

  // Animar la barra mientras espera
  var pct=20;var iv=setInterval(function(){pct=Math.min(90,pct+3);fill.style.width=pct+'%'},500);

  var fd=new FormData();fd.append('archivo',FILE);
  try{
    var r=await fetch('/api/admin/fotos/importar',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});
    clearInterval(iv);fill.style.width='100%';
    var d=await r.json();
    if(!r.ok){
      res.className='result err show';
      res.innerHTML='<h3>❌ Error</h3><div>'+(d.detail||'Error desconocido')+'</div>';
    }else{
      res.className='result ok show';
      var ejemplos=d.ejemplos_no_encontrados&&d.ejemplos_no_encontrados.length?'<details><summary>Ver ejemplos de códigos no encontrados</summary><code>'+d.ejemplos_no_encontrados.join('\n')+'</code></details>':'';
      res.innerHTML='<h3>✅ Importación completada</h3>'+
        '<div class="stat"><span>Filas en el CSV</span><b>'+d.total_filas+'</b></div>'+
        '<div class="stat"><span>Productos actualizados</span><b>'+d.actualizados+'</b></div>'+
        '<div class="stat"><span>Códigos no encontrados en DB</span><b>'+d.no_encontrados_en_db+'</b></div>'+
        '<div class="stat"><span>Filas sin foto en el CSV</span><b>'+d.sin_foto_en_csv+'</b></div>'+
        ejemplos;
    }
  }catch(e){
    clearInterval(iv);
    res.className='result err show';
    res.innerHTML='<h3>❌ Error de conexión</h3><div>'+(e.message||e)+'</div>';
  }
  btn.disabled=false;btn.textContent='Importar fotos';
  setTimeout(function(){pb.classList.remove('show');fill.style.width='0%'},1500);
}

(function(){
  TOKEN=getToken();
  if(TOKEN){
    // Validar token con un ping al endpoint admin
    fetch('/api/admin/banners',{headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){
      if(r.ok||r.status===404)showApp();
      else{TOKEN='';localStorage.removeItem('cs_token');document.getElementById('app-login').style.display='block'}
    }).catch(function(){showApp()});
  }else{
    document.getElementById('app-login').style.display='block';
  }
})();
</script>
</body>
</html>
