<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trama — Atención al Cliente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 30px rgba(0,0,0,0.05);
    }

    header {
      padding: 16px 20px;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .title { display: flex; align-items: center; gap: 12px; }
    header .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    header h1 { font-size: 16px; line-height: 1.2; }
    header p { font-size: 12px; color: #aaa; }
    header button {
      background: transparent;
      border: 1px solid #444;
      color: #ddd;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    header button:hover { background: #222; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f9fafb;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #111;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #fff;
      color: #111;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .msg.typing {
      align-self: flex-start;
      background: #fff;
      color: #888;
      border: 1px solid #e5e7eb;
      font-style: italic;
    }

    .composer {
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      font-size: 14px;
      outline: none;
    }
    .composer input:focus { border-color: #111; }
    .composer button {
      padding: 0 18px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <div class="avatar">S</div>
        <div>
          <h1>Sofi · Trama</h1>
          <p>Atención al cliente · 24/7</p>
        </div>
      </div>
      <button id="reset">Reiniciar</button>
    </header>

    <div id="messages"></div>

    <form id="composer" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Escribí tu consulta..." required />
      <button type="submit" id="send">Enviar</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const resetBtn = document.getElementById('reset');

    // Sesión persistente en localStorage para que sobreviva al refresh
    let sessionId = localStorage.getItem('trama_session');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem('trama_session', sessionId);
    }

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    addMessage('¡Hola! Soy Sofi, ¿en qué te puedo ayudar?', 'bot');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      sendBtn.disabled = true;

      const typing = addMessage('Sofi está escribiendo...', 'typing');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || ('HTTP ' + res.status));
        }
        const data = await res.json();
        typing.remove();
        addMessage(data.response, 'bot');
      } catch (err) {
        typing.remove();
        addMessage('Error: ' + err.message, 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    resetBtn.addEventListener('click', async () => {
      if (!confirm('¿Reiniciar la conversación?')) return;
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: 'reset' })
      });
      messagesEl.innerHTML = '';
      addMessage('¡Hola! Soy Sofi, ¿en qué te puedo ayudar?', 'bot');
    });
  </script>
</body>
</html>
