<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NEGOCIO}} — Tienda Online</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f4f5;--card:#fff;--txt:#18181b;--txt2:#71717a;--acc:#16a34a;--acc2:#15803d;--bord:#e4e4e7}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:80px}
  header{background:var(--card);border-bottom:1px solid var(--bord);padding:14px 16px;position:sticky;top:0;z-index:10}
  header h1{font-size:18px}
  header p{font-size:12px;color:var(--txt2)}
  .filtros{display:flex;gap:8px;padding:12px 16px;position:sticky;top:56px;background:var(--bg);z-index:9;flex-wrap:wrap}
  .filtros input,.filtros select{padding:9px 12px;border:1px solid var(--bord);border-radius:10px;font-size:14px;background:var(--card);color:var(--txt);outline:none}
  .filtros input{flex:1;min-width:160px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px}
  .prod{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .prod .nom{font-size:13px;line-height:1.3;min-height:34px}
  .prod .precio{font-size:17px;font-weight:700;color:var(--acc2)}
  .prod .sinstock{font-size:11px;color:#dc2626}
  .prod button{margin-top:4px;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:8px;font-size:13px;font-weight:600;cursor:pointer}
  .prod button:disabled{background:#d4d4d8;cursor:not-allowed}
  #mas{display:block;margin:20px auto;padding:10px 24px;border:1px solid var(--bord);background:var(--card);border-radius:10px;font-size:14px;cursor:pointer}
  #carrito-bar{position:fixed;bottom:0;left:0;right:0;background:var(--acc);color:#fff;padding:14px 16px;display:none;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end}
  #panel{background:var(--card);width:100%;max-height:80vh;border-radius:20px 20px 0 0;padding:18px;overflow-y:auto}
  #panel h2{font-size:17px;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bord)}
  .item .n{flex:1;font-size:13px}
  .item .qty{display:flex;align-items:center;gap:8px}
  .item .qty button{width:26px;height:26px;border:1px solid var(--bord);background:var(--bg);border-radius:6px;font-size:16px;cursor:pointer}
  #total{font-size:19px;font-weight:700;margin:14px 0}
  #enviar{width:100%;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .empty{text-align:center;padding:40px;color:var(--txt2)}
</style>
</head>
<body>
<header><h1>🛒 {{NEGOCIO}}</h1><p>Tienda online — elegí, armá tu pedido y lo terminás por WhatsApp</p></header>
<div class="filtros">
  <input id="q" placeholder="Buscar producto..." oninput="buscarDeb()">
  <select id="rubro" onchange="reset()"><option value="">Todos los rubros</option></select>
</div>
<div class="grid" id="grid"></div>
<button id="mas" onclick="cargar()" style="display:none">Ver más</button>
<div class="empty" id="empty" style="display:none">No encontramos productos.</div>

<div id="carrito-bar" onclick="abrir()">
  <span id="cb-items">0 productos</span><span id="cb-total">$0</span>
</div>

<div id="overlay" onclick="if(event.target===this)cerrar()">
  <div id="panel">
    <h2>Tu pedido</h2>
    <div id="items"></div>
    <div id="total">Total: $0</div>
    <button id="enviar" onclick="enviarWhatsapp()">Enviar pedido por WhatsApp 📲</button>
  </div>
</div>

<script>
const WA="{{WA_TIENDA}}";
const fmt=n=>'$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
let offset=0, cargando=false, fin=false;
const carrito={}; // codigo -> {nom, precio, cant}

async function initRubros(){
  const rs=await(await fetch('/api/tienda/rubros')).json();
  const sel=document.getElementById('rubro');
  rs.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});
}
function reset(){offset=0;fin=false;document.getElementById('grid').innerHTML='';cargar();}
let debT=null;function buscarDeb(){clearTimeout(debT);debT=setTimeout(reset,350);}

async function cargar(){
  if(cargando||fin)return;cargando=true;
  const q=document.getElementById('q').value.trim();
  const rubro=document.getElementById('rubro').value;
  const d=await(await fetch('/api/tienda/productos?buscar='+encodeURIComponent(q)+'&rubro='+encodeURIComponent(rubro)+'&limit=30&offset='+offset)).json();
  const grid=document.getElementById('grid');
  document.getElementById('empty').style.display=(offset===0&&!d.productos.length)?'block':'none';
  d.productos.forEach(p=>{
    const div=document.createElement('div');div.className='prod';
    div.innerHTML='<div class="nom">'+p.descripcion+'</div>'+
      '<div class="precio">'+fmt(p.precio)+'</div>'+
      (p.hay_stock?'':'<div class="sinstock">Sin stock — consultá</div>')+
      '<button onclick=\'add("'+p.codigo+'",'+JSON.stringify(p.descripcion)+','+p.precio+')\'>Agregar</button>';
    grid.appendChild(div);
  });
  offset+=d.productos.length;
  if(offset>=d.total||!d.productos.length)fin=true;
  document.getElementById('mas').style.display=fin?'none':'block';
  cargando=false;
}

function add(cod,nom,precio){
  if(!carrito[cod])carrito[cod]={nom,precio,cant:0};
  carrito[cod].cant++;
  render();
}
function cambiar(cod,delta){
  if(!carrito[cod])return;
  carrito[cod].cant+=delta;
  if(carrito[cod].cant<=0)delete carrito[cod];
  render();
}
function render(){
  const cods=Object.keys(carrito);
  const nItems=cods.reduce((s,c)=>s+carrito[c].cant,0);
  const total=cods.reduce((s,c)=>s+carrito[c].cant*carrito[c].precio,0);
  const bar=document.getElementById('carrito-bar');
  bar.style.display=nItems?'flex':'none';
  document.getElementById('cb-items').textContent=nItems+(nItems===1?' producto':' productos');
  document.getElementById('cb-total').textContent=fmt(total);
  document.getElementById('total').textContent='Total: '+fmt(total);
  document.getElementById('items').innerHTML=cods.length?cods.map(c=>
    '<div class="item"><div class="n">'+carrito[c].nom+'<br><b>'+fmt(carrito[c].precio)+'</b></div>'+
    '<div class="qty"><button onclick="cambiar(\''+c+'\',-1)">−</button>'+carrito[c].cant+
    '<button onclick="cambiar(\''+c+'\',1)">+</button></div></div>').join('')
    :'<p class="empty">Carrito vacío</p>';
}
function abrir(){document.getElementById('overlay').style.display='flex';}
function cerrar(){document.getElementById('overlay').style.display='none';}

function enviarWhatsapp(){
  const cods=Object.keys(carrito);
  if(!cods.length)return;
  let msg='Hola! Quiero hacer este pedido desde la tienda online:%0A%0A';
  let total=0;
  cods.forEach(c=>{
    const it=carrito[c];total+=it.cant*it.precio;
    msg+='• '+it.nom+' x'+it.cant+' = '+fmt(it.cant*it.precio)+'%0A';
  });
  msg+='%0ATotal aprox: '+fmt(total);
  if(WA){
    window.open('https://wa.me/'+WA+'?text='+msg,'_blank');
  }else{
    alert('El WhatsApp de la tienda no está configurado. Avisale al administrador.');
  }
}

initRubros();cargar();
window.addEventListener('scroll',()=>{
  if(window.innerHeight+window.scrollY>=document.body.offsetHeight-300)cargar();
});
</script>
</body>
</html>
